# Coolify > Configuration > General > Custom Nginx Configuration (ambiente de TESTE)
# Igual à landing, mas com X-Robots-Tag: o Google não indexa este endereço.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # /moldura-touch -> /moldura-touch/ sem trocar o domínio nem a porta atrás do proxy do Coolify
    absolute_redirect off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # arquivos internos do projeto não são públicos
    location ^~ /tools/ { return 404; }
    location ^~ /deploy/ { return 404; }
    location ^~ /seo/ { return 404; }
    location = /README.md { return 404; }

    location ~* \.(?:css|js)$ { expires 7d; }
    location ~* \.(?:webp|png|jpg|jpeg|svg|mp4|woff2)$ { expires 30d; }

    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
