# Coolify > Configuration > General > Custom Nginx Configuration (caminho 3: novo site na home, loja em https://loja.qualipix.com.br)
# GERADO por tools/migration/build.mjs a partir de seo/urls.csv: não edite à mão.
# 90 URLs antigas recriadas no mesmo caminho, 11 com 301 para a página principal (duplicadas e quebradas) e 2 que seguem para a loja no mesmo caminho.
# Qualquer endereço que não exista neste site vai para a loja com 301, sem perder a URL.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # /moldura-touch -> /moldura-touch/ sem trocar o domínio nem a porta atrás do proxy do Coolify
    absolute_redirect off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # arquivos internos do projeto não são públicos
    location ^~ /tools/ { return 404; }
    location ^~ /deploy/ { return 404; }
    location ^~ /seo/ { return 404; }
    location = /README.md { return 404; }

    location ~* \.(?:css|js)$ { expires 7d; }
    location ~* \.(?:webp|png|jpg|jpeg|svg|mp4|woff2)$ { expires 30d; }

    # URLs antigas com destino próprio
    location = /produtos/acessorios/ { return 301 /acessorios/; }
    location = /totems/ { return 301 /produtos/totens/; }
    location = /lousa-branca-interativa/ { return 301 /produtos/lousa-branca-interativa/; }
    location = /molduras-touch/ { return 301 /produtos/molduras-touch/; }
    location = /molduras/ { return 301 /produtos/molduras-touch/; }
    location = /politica-privacidade/ { return 301 /m/politica-de-privacidade/; }
    location = /sobre/ { return 301 /m/empresa/; }
    location = /display-interativo/ { return 301 /lousa-digital/; }
    location = /m/a-empresa/ { return 301 /m/empresa/; }
    location = /m/multimidia/ { return 301 /produtos/; }
    location = /sala-de-aula-qualipix-n-1/ { return 301 /educacao/; }

    location / { try_files $uri $uri/ @loja; }
    location @loja { return 301 https://loja.qualipix.com.br$request_uri; }
}
